# Baut die Android-APK der Flet-App (android/flet) und liefert sie als Artifact.
# Start: automatisch bei Aenderungen unter android/** oder manuell (Run workflow).
name: Android APK

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", ".github/workflows/android-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/flet
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet
    - name: Build APK
      env:
        PYTHONUTF8: "1"
      run: flet build apk --yes --verbose --no-rich-output
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lm-optimizer-apk
        path: android/flet/build/apk/*.apk
        if-no-files-found: error
